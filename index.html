<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 수업용 「모두 같은 문제」 — ?fix=1 로 열면 문제·보기 순서가 고정됩니다 -->
<script src="https://hongyul67-cpu.github.io/links/fixorder.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자동화설비기능사 필기 · 기출 마스터</title>
<style>
  :root{
    --bg:#0f172a; --panel:#ffffff; --ink:#1e293b; --muted:#64748b;
    --brand:#2563eb; --brand-d:#1d4ed8; --line:#e2e8f0;
    --ok:#16a34a; --ok-bg:#dcfce7; --no:#dc2626; --no-bg:#fee2e2;
    --soft:#f1f5f9; --gold:#f59e0b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,#0f172a,#1e3a8a);color:var(--ink);min-height:100vh}
  .wrap{max-width:820px;margin:0 auto;padding:16px 14px 60px}
  header.top{display:flex;align-items:center;gap:10px;color:#fff;padding:6px 2px 14px}
  header.top .logo{font-size:22px}
  header.top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.5px}
  header.top .sub{font-size:12px;color:#c7d2fe;margin-top:2px}
  .card{background:var(--panel);border-radius:16px;box-shadow:0 10px 30px rgba(2,6,23,.28);padding:18px}
  /* home */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
  .mode{cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:16px;transition:.15s;background:#fff}
  .mode:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 6px 18px rgba(37,99,235,.15)}
  .mode .ic{font-size:26px}
  .mode h3{margin:8px 0 4px;font-size:16px}
  .mode p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
  .mode.wide{grid-column:1/3}
  .stat{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .chip{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:12.5px;color:#334155}
  .chip b{color:var(--brand)}
  /* generic */
  .btn{border:0;border-radius:11px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-d)}
  .btn.ghost{background:var(--soft);color:#334155}
  .btn.block{width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .back{background:none;border:0;color:#c7d2fe;font-size:14px;cursor:pointer;padding:6px 2px;font-family:inherit}
  .pill{display:inline-block;background:#eef2ff;color:var(--brand);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
  .subjbar{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
  .subjbar button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit;color:#475569}
  .subjbar button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* question */
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
  .qno{font-weight:800;color:var(--brand);font-size:15px}
  .qsubj{font-size:11.5px;color:var(--muted)}
  .qtext{font-size:16.5px;line-height:1.6;font-weight:600;margin:6px 0 12px;word-break:keep-all}
  .qimg{width:100%;border:1px solid var(--line);border-radius:10px;margin:4px 0 14px;background:#fff}
  .choices{display:flex;flex-direction:column;gap:9px}
  .choice{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;
    padding:12px 13px;cursor:pointer;transition:.12s;background:#fff;font-size:15px;line-height:1.5}
  .choice:hover{border-color:#93c5fd;background:#f8fafc}
  .choice .num{font-weight:800;color:#64748b;flex:0 0 auto}
  .choice.sel{border-color:var(--brand);background:#eff6ff}
  .choice.correct{border-color:var(--ok);background:var(--ok-bg)}
  .choice.wrong{border-color:var(--no);background:var(--no-bg)}
  .choice.disabled{cursor:default}
  /* 위줄(A̅)·밑줄(24̲)·취소선(24̶) — 글꼴에 없으면 안 보이므로 직접 그린다 */
  .ovl,.und,.stk{white-space:nowrap}
  .ovl{border-top:1.7px solid currentColor;padding-top:1px}
  .und{border-bottom:1.7px solid currentColor;padding-bottom:1px}
  .stk{text-decoration:line-through;text-decoration-thickness:1.7px}
  .expl{margin-top:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.65;color:#78350f;display:none;word-break:keep-all}
  .expl.show{display:block}
  .expl b{color:#b45309}
  .expl b.ansline{display:block;color:#166534;background:#dcfce7;border:1px solid #86efac;border-radius:8px;padding:6px 10px;margin-bottom:8px;font-size:15px}
  .navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
  /* OMR grid */
  .omr{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:6px}
  .omr button{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;color:#475569}
  .omr button.done{background:#dbeafe;border-color:#93c5fd;color:var(--brand);font-weight:700}
  .omr button.okmark{background:var(--ok-bg);border-color:#86efac;color:#166534}
  .omr button.nomark{background:var(--no-bg);border-color:#fca5a5;color:#991b1b}
  .omr button.cur{outline:2px solid var(--brand);outline-offset:1px}
  .timer{font-weight:800;font-size:15px;color:#0f172a;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:6px 12px}
  .timer.warn{color:#b91c1c;background:#fee2e2;border-color:#fecaca}
  /* result */
  .scorebig{font-size:44px;font-weight:900;text-align:center;letter-spacing:-1px}
  .passbar{height:14px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin:14px 0}
  .passbar > div{height:100%;border-radius:999px}
  .result-note{text-align:center;font-size:15px;margin-top:6px}
  .miniq{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
  .miniq .qtext{font-size:14.5px;font-weight:600;margin:2px 0 8px}
  .tag-ok{color:var(--ok);font-weight:800}
  .tag-no{color:var(--no);font-weight:800}
  .empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14.5px}
  .foot{color:#94a3b8;font-size:11.5px;text-align:center;margin-top:22px}
  select{font-family:inherit;font-size:14px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#fff}
  /* theory */
  .tlist{display:flex;flex-direction:column;gap:8px}
  .titem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:#fff;transition:.12s;font-size:14.5px}
  .titem:hover{border-color:var(--brand);background:#f8fafc}
  .titem.sm{padding:10px 12px;font-size:14px}
  .tic{font-size:22px}
  .tbar{height:6px;background:#e2e8f0;border-radius:999px;margin:6px 0 4px;overflow:hidden}
  .tbar>div{height:100%;background:var(--brand);border-radius:999px}
  .tbody{font-size:15px;line-height:1.75;color:#1e293b;word-break:keep-all}
  .tbody h4.th{margin:18px 0 6px;font-size:15px;color:var(--brand);border-left:4px solid var(--brand);padding-left:8px}
  .tbody .tp{margin:6px 0}
  .tbody ul.tul{margin:6px 0;padding-left:20px}
  .tbody ul.tul li{margin:5px 0}
  .ttblwrap{overflow-x:auto;margin:8px 0}
  table.ttbl{border-collapse:collapse;width:100%;font-size:13.5px;min-width:340px}
  table.ttbl td,table.ttbl th{border:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
  table.ttbl th{background:#eff6ff;color:var(--brand);font-weight:700}
  table.ttbl tr:nth-child(odd) td{background:#fafbfc}
  .ttip{margin-top:14px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:11px 13px;font-size:13.5px;color:#065f46;line-height:1.6}
  .tfig{margin:16px 0 6px;text-align:center}
  .tfig svg{width:100%;max-width:560px;height:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
  .tfig figcaption{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5}
  /* 우리 반 랭킹 */
  .rklist{display:flex;flex-direction:column;gap:8px}
  .rkrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff}
  .rkrow.me{border-color:var(--brand);background:#eff6ff;box-shadow:0 0 0 2px rgba(37,99,235,.12)}
  .rkno{min-width:44px;text-align:center;font-weight:800;font-size:14px;color:var(--muted)}
  .rkno.top{font-size:22px}
  .rkme{background:var(--brand);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;vertical-align:middle}
  .rksub{font-size:12px;color:var(--muted);margin-top:3px}
  .rkrp{font-weight:900;font-size:17px;color:var(--brand);white-space:nowrap}
  .rkrp small{font-size:11px;margin-left:2px;font-weight:700}
  body.board .rkrow{padding:16px 18px;font-size:clamp(16px,1.6vw,24px)}
  body.board .rkrp{font-size:clamp(18px,1.9vw,28px)}
  /* slide(수업) mode */
  .slidecard{display:flex;flex-direction:column}
  .sl-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .sl-chip{background:#eef2ff;color:var(--brand);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:800}
  .sl-count{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap}
  .sl-prog{height:5px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-bottom:16px}
  .sl-prog>div{height:100%;background:var(--brand);border-radius:999px;transition:width .2s}
  .sl{min-height:300px;display:flex;flex-direction:column;justify-content:center;min-width:0;overflow-wrap:anywhere}
  .sl>*{min-width:0;max-width:100%}
  .sl-title,.sl-h,.sl-ul li,.sl-p,.sl-tip{overflow-wrap:anywhere}
  .sl-cover{align-items:center;text-align:center;gap:10px}
  .sl-badge{display:inline-block;background:var(--brand);color:#fff;border-radius:999px;padding:5px 16px;font-size:13px;font-weight:800}
  .sl-title{font-size:29px;font-weight:900;margin:14px 0 0;line-height:1.35;word-break:keep-all;letter-spacing:-.5px}
  .sl-note{color:var(--muted);font-size:14px;margin-top:8px}
  .sl-h{font-size:21px;font-weight:800;color:var(--brand);margin:0 0 16px;line-height:1.4;word-break:keep-all;
    border-left:5px solid var(--brand);padding-left:11px}
  .sl-ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px}
  .sl-ul li{font-size:17.5px;line-height:1.6;word-break:keep-all;background:#f8fafc;border:1px solid var(--line);
    border-radius:12px;padding:12px 15px;position:relative;padding-left:38px}
  .sl-ul li:before{content:"•";position:absolute;left:16px;top:11px;color:var(--brand);font-size:20px;font-weight:900}
  .sl-p{font-size:17.5px;line-height:1.75;margin:0;word-break:keep-all;background:#f8fafc;border-radius:12px;padding:16px 18px}
  table.sl-tbl{font-size:15.5px}
  table.sl-tbl td,table.sl-tbl th{padding:11px 12px}
  .sl-tipwrap{justify-content:center}
  .sl-tip{background:#ecfdf5;border:2px solid #6ee7b7;border-radius:16px;padding:22px 24px;font-size:18px;
    line-height:1.7;color:#065f46;word-break:keep-all;text-align:center}
  .sl-tip>b{display:block;color:#047857;font-size:15px;margin-bottom:10px}
  .sl-tip div b{color:#065f46;background:#d1fae5;border-radius:5px;padding:0 5px}
  .slidecard .tfig{margin:0}
  .slidecard .tfig svg{max-width:100%;border:0;padding:0}
  body.big .sl-title{font-size:38px}
  body.big .sl-h{font-size:27px}
  body.big .sl-ul li{font-size:23px;padding:15px 18px 15px 42px}
  body.big .sl-p{font-size:23px}
  body.big table.sl-tbl{font-size:20px}
  body.big .sl-tip{font-size:23px}
  body.big .sl{min-height:400px}
  /* ── 전자칠판 모드: 큰 화면 + 손가락 터치 ── */
  body.board .wrap{max-width:1400px;padding:14px 22px 40px}
  body.board .slidecard{padding:26px 30px}
  body.board .sl{min-height:58vh}
  body.board .sl-title{font-size:clamp(30px,4.4vw,60px)}
  body.board .sl-h{font-size:clamp(22px,2.5vw,36px);border-left-width:7px;padding-left:15px;margin-bottom:20px}
  body.board .sl-ul{gap:14px}
  body.board .sl-ul li{font-size:clamp(18px,1.85vw,28px);padding:16px 20px 16px 50px;border-radius:14px}
  body.board .sl-ul li:before{left:20px;top:14px;font-size:26px}
  body.board .sl-p{font-size:clamp(18px,1.85vw,28px);padding:20px 24px}
  body.board table.sl-tbl{font-size:clamp(16px,1.55vw,24px)}
  body.board table.sl-tbl td,body.board table.sl-tbl th{padding:14px 16px}
  body.board .sl-tip{font-size:clamp(19px,1.95vw,30px);padding:26px 30px}
  body.board .sl-tip>b{font-size:clamp(15px,1.4vw,21px)}
  body.board .sl-badge{font-size:clamp(13px,1.2vw,19px);padding:7px 20px}
  body.board .sl-chip{font-size:clamp(13px,1.2vw,19px);padding:6px 16px}
  body.board .sl-count{font-size:clamp(13px,1.2vw,19px)}
  body.board .sl-prog{height:8px}
  body.board .tfig svg{max-width:min(100%,980px)}
  body.board .blk{min-width:90px;font-size:clamp(18px,1.85vw,28px);padding:2px 16px}
  body.board .lhint{font-size:clamp(14px,1.4vw,21px);padding:14px 18px}
  /* 터치 버튼 크게 */
  body.board .lessonnav{gap:14px;margin-top:24px}
  body.board .lessonnav .btn{min-height:64px;font-size:clamp(16px,1.6vw,24px);border-radius:14px}
  body.board .back{font-size:clamp(14px,1.4vw,20px);padding:10px 6px}
  body.board .qtext{font-size:clamp(19px,1.9vw,30px)}
  body.board .choice{font-size:clamp(17px,1.75vw,27px);padding:16px 18px;border-radius:14px}
  body.board .expl{font-size:clamp(16px,1.6vw,24px)}
  body.board .titem{font-size:clamp(16px,1.6vw,24px);padding:18px 20px}
  body.board .btn{padding:14px 20px}
  /* lesson(수업) mode */
  .steps{display:flex;gap:6px;margin-bottom:14px}
  .steps .step{flex:1;text-align:center;padding:9px 4px;border-radius:10px;background:#f1f5f9;color:#94a3b8;font-size:13px;font-weight:800}
  .steps .step.on{background:var(--brand);color:#fff}
  .blk{display:inline-block;min-width:58px;padding:1px 12px;margin:0 2px;background:#fef3c7;border-bottom:2.5px solid #f59e0b;
    border-radius:6px;color:#b45309;font-weight:800;cursor:pointer;text-align:center;transition:.12s}
  .blk:hover{background:#fde68a}
  .blk.on{background:#dcfce7;border-color:#16a34a;color:#166534;cursor:default;min-width:0;padding:1px 6px}
  .lhint{background:#eff6ff;border:1px solid #bfdbfe;border-radius:11px;padding:10px 13px;font-size:13.5px;color:#1e40af;margin-bottom:12px;line-height:1.6}
  .lessonnav{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}
  .lessonnav .btn{flex:1;min-width:120px}
  body.big .tbody{font-size:19px;line-height:1.85}
  body.big .qtext{font-size:20px}
  body.big table.ttbl{font-size:16px}
  body.big .choice{font-size:18px}
  body.big .expl{font-size:17px}
  body.big .blk{min-width:78px;font-size:19px}
  @media(max-width:520px){.omr{grid-template-columns:repeat(8,1fr)}.modes{grid-template-columns:1fr}.mode.wide{grid-column:auto}}
</style>
</head>

<!-- 수업 슬라이드 — 예전 board.html 이 index 안으로 들어왔습니다.
     원고(lesson-board.js) 는 이 저장소 것, 화면(board-pro.js) 은 links 의 공용 파일입니다.
     저장소에 사본을 두지 않습니다 — 화면을 고쳐야 하면 links 저장소에서 고칩니다. -->
<script src="lesson-board.js"></script>
<script src="https://hongyul67-cpu.github.io/links/board-pro.js"></script>
<script>
const $=(s,el=document)=>el.querySelector(s);
const app=$("#app");
const EXAMS=(window.EXAMS||[]).sort((a,b)=>(b.year-a.year)||(b.round-a.round));
const NUM=["","①","②","③","④","⑤"];
const LS={
  wrongKey:"autoexam_wrong_v1", statKey:"autoexam_stat_v1",
  getWrong(){try{return JSON.parse(localStorage.getItem(this.wrongKey))||[]}catch(e){return[]}},
  setWrong(a){localStorage.setItem(this.wrongKey,JSON.stringify(a))},
  addWrong(examKey,no){const w=this.getWrong();if(!w.some(x=>x.k===examKey&&x.no===no)){w.push({k:examKey,no});this.setWrong(w)}},
  removeWrong(examKey,no){this.setWrong(this.getWrong().filter(x=>!(x.k===examKey&&x.no===no)))},
  getStat(){try{return JSON.parse(localStorage.getItem(this.statKey))||{solved:0,correct:0,exams:0}}catch(e){return{solved:0,correct:0,exams:0}}},
  setStat(s){localStorage.setItem(this.statKey,JSON.stringify(s))},
  readKey:"autoexam_read_v1",
  getRead(){try{return JSON.parse(localStorage.getItem(this.readKey))||{}}catch(e){return{}}},
  markRead(k){const r=this.getRead();if(!r[k]){r[k]=1;localStorage.setItem(this.readKey,JSON.stringify(r));}}
};

/* ---------------- 클라우드 동기화 (Google 시트 / Apps Script) ---------------- */
const SYNC_URL=(window.AUTOEXAM_CONFIG&&window.AUTOEXAM_CONFIG.syncUrl)||"";
const SYNC={
  meKey:"autoexam_me_v1", _t:null,
  on(){return !!SYNC_URL;},
  me(){try{return JSON.parse(localStorage.getItem(this.meKey))}catch(e){return null}},
  setMe(m){localStorage.setItem(this.meKey,JSON.stringify(m));},
  ready(){return this.on()&&!!this.me();},
  _post(obj){if(!this.ready())return;
    try{fetch(SYNC_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)});}catch(e){}},
  save(){if(!this.ready())return;const me=this.me();
    const r=(typeof Rank!=="undefined"&&Rank)?(function(){try{const g=Rank.get();return {rp:g.rp||0,tier:(g.tier&&g.tier.full)||""};}catch(e){return {rp:0,tier:""};}})():{rp:0,tier:""};
    this._post({action:"save",cls:me.cls,name:me.name,wrong:LS.getWrong(),stat:LS.getStat(),rp:r.rp,tier:r.tier});flashSync();},
  rank(cls){if(!this.on())return Promise.resolve(null);
    return jsonp(SYNC_URL+"?action=rank&cls="+encodeURIComponent(cls||"")).catch(()=>null);},
  saveSoon(){if(!this.ready())return;clearTimeout(this._t);this._t=setTimeout(()=>this.save(),1200);},
  result(exam,score,correct,total){if(!this.ready())return;const me=this.me();
    this._post({action:"result",cls:me.cls,name:me.name,exam:exam,score:score,correct:correct,total:total});},
  load(){if(!this.ready())return Promise.resolve(null);const me=this.me();
    const u=SYNC_URL+"?action=load&cls="+encodeURIComponent(me.cls)+"&name="+encodeURIComponent(me.name);
    return jsonp(u).catch(()=>null);}
};
function jsonp(url){return new Promise((res,rej)=>{
  const cb="__jp"+Math.random().toString(36).slice(2);
  window[cb]=d=>{res(d);done();};
  const s=document.createElement("script");
  s.src=url+(url.indexOf("?")<0?"?":"&")+"callback="+cb;
  s.onerror=()=>{rej(new Error("net"));done();};
  function done(){try{delete window[cb]}catch(e){}s.remove();}
  document.body.appendChild(s);
  setTimeout(()=>{if(window[cb]){rej(new Error("timeout"));done();}},10000);
});}
function flashSync(){const el=$("#syncdot");if(!el)return;el.textContent="☁ 저장됨";el.style.color="var(--ok)";
  setTimeout(()=>{const e2=$("#syncdot");if(e2){e2.textContent="☁ 자동 저장";e2.style.color="";}},1400);}
function mergeRemote(r){if(!r||(r.found===false))return;
  const local=LS.getWrong(),rem=r.wrong||[],seen=new Set(local.map(x=>x.k+"#"+x.no));
  rem.forEach(x=>{const kk=x.k+"#"+x.no;if(!seen.has(kk)){local.push({k:x.k,no:x.no});seen.add(kk);}});
  LS.setWrong(local);
  if(r.stat){const ls=LS.getStat();if((r.stat.solved||0)>=(ls.solved||0))
    LS.setStat({solved:r.stat.solved||0,correct:r.stat.correct||0,exams:r.stat.exams||ls.exams||0});}
}

/* 문자 위·아래에 붙는 결합 부호(위줄 A̅, 밑줄 24̲, 취소선 24̶)는

function boardRc(url){

let CBT=null;
/* 수업용 링크(?fix=…)로 들어왔는가 — fixorder.js 가 켜 준다.
   이때는 Math.random 이 그날치로 고정되어 있어, 섞더라도 모두 같은 순서가 나온다. */
function fixMode(){return !!(window.FixOrder&&window.FixOrder.on);}
function shuffled(a,rnd){a=a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor((rnd||Math.random)()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}
  return a;}
/* 이 회차를 섞을 때 쓸 난수.
   수업용 링크에서는 그날 시드로 우리끼리 만들어 쓴다 — 다른 위젯이 난수를
   몇 번 뽑든 상관없이, 같은 날 같은 회차면 모든 학생이 같은 순서를 받는다. */
function mixRnd(idx){
  if(!fixMode())return Math.random;
  let a=(((window.FixOrder.seed>>>0)+idx*0x9E3779B9)>>>0);
  return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};
}
/* 보기를 섞어도 되는 문제인가.
   ① 보기가 그림인 문제는 ①~④ 가 곧 그림 속 차례라 섞으면 답이 어긋난다.
   ② 문제나 보기에 ①~④ 가 적혀 있으면 그 번호가 도면 품번 같은 다른 뜻일 수 있다.
   ③ «위 모두 옳다» 류 보기는 자리를 옮기면 말이 되지 않는다. */
const CIRCLED=/[①②③④]/;
const AGGREG=/모두 (옳|맞|정답|해당)|위 모두|위의 모두|정답이 없|해당 없/;
function mixable(q){
  return !q.choicesImg && !CIRCLED.test(q.q||"")
      && !(q.choices||[]).some(c=>CIRCLED.test(c)||AGGREG.test(c));
}
/* 보기를 섞고 정답 번호를 새 자리로 옮긴다. 해설이 «③은 틀림» 처럼
   번호를 짚는 경우가 많아 해설 속 ①~④ 도 같이 바꿔 준다. */
function mixChoices(q,rnd){
  if(!mixable(q))return q;
  const ord=shuffled(q.choices.map((_,i)=>i),rnd);    // ord[새자리] = 옛자리
  const to=[];ord.forEach((old,now)=>{to[old]=now;}); // to[옛자리] = 새자리
  return Object.assign({},q,{
    choices:ord.map(i=>q.choices[i]),
    answer:to[q.answer-1]+1,
    explain:(q.explain||"").replace(/[①②③④]/g,ch=>NUM[to[NUM.indexOf(ch)-1]+1])
  });
}
function mixExam(e,idx){const rnd=mixRnd(idx);
  return Object.assign({},e,{questions:shuffled(e.questions,rnd).map(q=>mixChoices(q,rnd))});}
function startCBT(idx,mix){
  const e=mix?mixExam(EXAMS[idx],idx):EXAMS[idx];
  CBT={exam:e,idx:idx,mix:!!mix,i:0,ans:{},submitted:false,left:60*60,timer:null};
  CBT.timer=setInterval(()=>{CBT.left--;if(CBT.left<=0){clearInterval(CBT.timer);submitCBT()}else updateTimer();},1000);
  renderCBT();
}
function updateTimer(){const t=$("#timer");if(!t||!CBT)return;const m=Math.floor(CBT.left/60),s=CBT.left%60;
  t.textContent=`⏱ ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;t.classList.toggle("warn",CBT.left<=300);}
function renderCBT(){
  const e=CBT.exam,q=e.questions[CBT.i];
  const answered=Object.keys(CBT.ans).length;
  app.innerHTML=`
  <div class="row" style="justify-content:space-between;color:#fff;margin-bottom:8px">
    <button class="back" onclick="quitCBT()">← 나가기</button>
    <span class="timer" id="timer">⏱ 60:00</span>
  </div>
  <div class="card">
    <div class="qhead"><span class="qno">문 ${CBT.i+1} / ${e.questions.length}</span><span class="qsubj">${esc(q.subject)}</span></div>
    <div class="qtext">${fmt(q.q)}</div>
    ${q.img?`<img class="qimg" src="${q.img}" alt="문제 그림">`:""}
    <div class="choices" id="choices"></div>
    <div class="navbtns">
      <button class="btn ghost" onclick="cbtGo(-1)" ${CBT.i===0?"disabled":""}>◀ 이전</button>
      ${CBT.i===e.questions.length-1
        ? `<button class="btn primary" onclick="submitCBT()">제출하기 (${answered}/${e.questions.length})</button>`
        : `<button class="btn primary" onclick="cbtGo(1)">다음 ▶</button>`}
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between"><b style="font-size:13.5px">답안지 (OMR)</b>
      <span style="font-size:12.5px;color:var(--muted)">${answered}/${e.questions.length} 완료</span></div>
    <div class="omr" id="omr"></div>
  </div>`;
  const ch=$("#choices");
  q.choices.forEach((c,k)=>{const n=k+1;const sel=CBT.ans[q.no]===n;
    const d=document.createElement("div");d.className="choice"+(sel?" sel":"");
    d.innerHTML=`<span class="num">${NUM[n]}</span><span>${q.choicesImg?"":fmt(c)}</span>`;
    d.onclick=()=>{CBT.ans[q.no]=n;renderCBT();};ch.appendChild(d);});
  const omr=$("#omr");

}

function quitCBT(){if(confirm("시험을 종료하고 홈으로 이동할까요? (답안은 저장되지 않습니다)")){clearInterval(CBT.timer);CBT=null;home();}}
function submitCBT(){

function resultCBT(correct,wrongList){

const BASE_TOOL="자동화설비 필기";
/* ---- 계급·랭크포인트 (rank.js 위젯) ---- */
function hasRank(){return typeof Rank!=="undefined"&&Rank&&typeof Rank.award==="function";}
function awardRP(scorePct,mode){
  if(!hasRank())return null;
  try{return Rank.award(scorePct,{mode:mode});}catch(e){return null;}
}
function rankDetail(){
  if(!hasRank())return "";
  try{const g=Rank.get();return ((g.tier&&g.tier.full)||"")+" · "+(g.rp||0)+"RP";}catch(e){return "";}
}
function rpBox(res){
  if(!res||!hasRank())return "";
  try{return Rank.resultBox(res);}catch(e){return "";}
}
function rcReady(){return !!(window.ResultCollector&&ResultCollector.config&&ResultCollector.config.endpoint);}
/* ── 틀린 문제를 "무엇을 틀렸는지"로 남긴다 (규약 §1 ②) ──
   예) "7번 공압 실린더→유압 실린더" */
function rcShort(t,len){
  t=String(t==null?"":t).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
  return t.length>len ? t.slice(0,len-1)+"\u2026" : t;
}
function rcWrongOf(q, my){
  const ch=q.choices||[];
  const mine = (my>=1 && ch[my-1]!=null) ? rcShort(ch[my-1],16) : "\ubb34\uc751\ub2f5";
  const ans  = (q.answer>=1 && ch[q.answer-1]!=null) ? rcShort(ch[q.answer-1],16) : "?";
  const head = (q.no!=null?q.no:"?")+"\ubc88";
  const subj = q.subject ? " "+rcShort(q.subject,10)+" \u00b7 " : " ";
  return q.choicesImg ? (head+subj+"\uadf8\ub9bc \ubcf4\uae30 "+my+"\u2192"+q.answer)
                      : (head+subj+mine+"\u2192"+ans);
}
/* ── 생기부 키워드용: 활동별 도전 횟수 (제출할 때마다 1씩 증가, 기기에 저장) ── */
function bumpTry(mode){
  const K="try_자동화설비필기";
  let d={}; try{d=JSON.parse(localStorage.getItem(K))||{};}catch(e){}
  d[mode]=(d[mode]||0)+1;
  try{localStorage.setItem(K,JSON.stringify(d));}catch(e){}
  return d[mode];
}
/* 제출 — 생기부용 키워드 자료(활동명·도전횟수·계급)를 함께 보낸다.
   시트 탭(tool)은 하나로 두고, 어느 파트인지는 mode 로 보낸다 (규약 §1 ①). */
function sendResult(tool, mode, payload){
  if(!rcReady()){
    alert(["이 링크로는 제출이 되지 않아요.","",
      "선생님이 나눠 준 제출용 링크(주소 뒤에 ?rc=... 가 붙은 링크)로",
      "들어와야 반·번호를 입력하고 결과를 보낼 수 있습니다.","",
      "연습은 지금 이대로 계속 하셔도 됩니다."].join(String.fromCharCode(10)));
    return;
  }
  ResultCollector.config.tool=BASE_TOOL;
  ResultCollector.open(Object.assign({
    mode: mode,
    retry: bumpTry(mode),
    tier: hasRank()?(function(){try{return Rank.get().tier.full;}catch(e){return undefined;}})():undefined
  }, payload));
}
function submitResult(){
  sendResult(BASE_TOOL, "자동화설비 필기 — "+CBT.exam.title, {
    score:CBT._score, correct:CBT._correct, total:CBT._total,
    wrong:(CBT._wrong||[]).map(q=>rcWrongOf(q, CBT.ans[q.no])),
    durationSec:CBT._dur, detail:rankDetail(),
    extra:["기출 회차 전 범위 응시"]
  });
}
function reviewCBT(){
  const list=CBT._wrong||[];
  let html=`<button class="back" onclick="home()">← 홈</button><div class="card"><span class="pill">틀린 문제 해설</span>`;
  if(!list.length)html+=`<div class="empty">틀린 문제가 없습니다. 완벽합니다! 🏆</div>`;
  list.forEach(q=>{
    const my=CBT.ans[q.no];
    html+=`<div class="miniq">
      <div class="qhead"><span class="qno">문 ${q.no}</span><span class="qsubj">${esc(q.subject)}</span></div>
      <div class="qtext">${fmt(q.q)}</div>
      ${q.img?`<img class="qimg" src="${q.img}">`:""}
      <div style="font-size:14px;line-height:1.7">
        ${q.choices.map((c,k)=>{const n=k+1;let t=q.choicesImg?"":fmt(c);
          if(n===q.answer)return `<div class="tag-ok">${NUM[n]} ${t} ✔ 정답</div>`;
          if(n===my)return `<div class="tag-no">${NUM[n]} ${t} ✘ 내 답</div>`;
          return `<div style="color:#94a3b8">${NUM[n]} ${t}</div>`;}).join("")}
      </div>
      <div class="expl show"><b>해설</b> · ${fmt(q.explain)}</div>
    </div>`;
  });
  html+=`</div>`;app.innerHTML=html;
}

function buildStudyList(){

  if(shuf)for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}

function relatedQs(subject,keys){
  if(!keys||!keys.length)return [];
  const scan=(sameSubj)=>{const out=[];
    EXAMS.forEach(e=>{e.questions.forEach(q=>{
      if(sameSubj&&q.subject!==subject)return;
      const hay=(q.q||"")+" "+(q.explain||"")+" "+(q.choices||[]).join(" ");
      if(keys.some(k=>hay.indexOf(k)>=0))out.push({...q,_k:examKey(e)});
    });});
    return out;};
  const same=scan(true);
  return same.length?same:scan(false);   // 과목 내에 없으면 전 과목에서 찾기
}

/* --- 개념 카드를 수업용 슬라이드로 자동 분할 --- */
const SLIDE_LIST=5, SLIDE_ROWS=6, SLIDE_CHARS=210;
function plain(x){return String(x).replace(/<[^>]+>/g,"");}
/* 개수와 글자수를 함께 고려해 슬라이드 단위로 나눔 */
function chunk(items,maxCount,maxChars,textOf){
  const out=[];let cur=[],len=0;
  items.forEach(it=>{
    const L=plain(textOf(it)).length;
    if(cur.length&&(cur.length>=maxCount||len+L>maxChars)){out.push(cur);cur=[];len=0;}
    cur.push(it);len+=L;
  });
  if(cur.length)out.push(cur);
  return out;
}
function buildSlides(s,k){
  const out=[{kind:"cover",title:k.t,sub:s.subject}];
  const figs=FIGS[s.subject+"|"+k.t]||[];
  figs.forEach(f=>out.push({kind:"fig",svg:f.svg,cap:f.cap}));
  (k.body||[]).forEach(b=>{
    if(b.ul&&b.ul.length){
      const parts=chunk(b.ul,SLIDE_LIST,SLIDE_CHARS,x=>x);
      parts.forEach((p,i)=>out.push({kind:"list",
        title:(b.h||"")+(parts.length>1?` (${i+1}/${parts.length})`:""),items:p}));
    } else if(b.tbl&&b.tbl.length){
      const hasHead=/^(구분|명칭|기호|항목|종류|적용|호칭|회로|급수|용어|기입)/.test(String(b.tbl[0][0]));
      const head=hasHead?b.tbl[0]:null, rows=hasHead?b.tbl.slice(1):b.tbl;
      const parts=chunk(rows,SLIDE_ROWS,SLIDE_CHARS,r=>r.join(""));
      parts.forEach((p,i)=>out.push({kind:"table",
        title:(b.h||"")+(parts.length>1?` (${i+1}/${parts.length})`:""),head:head,rows:p}));
    } else if(b.p){
      out.push({kind:"text",title:b.h||"",p:b.p});
    } else if(b.tip){
      out.push({kind:"tip",text:b.tip});
    }
  });
  return out;
}
function slideHtml(sl){
  if(sl.kind==="cover")return `<div class="sl sl-cover">
    <div class="sl-badge">${esc(sl.sub)}</div><h2 class="sl-title">${esc(sl.title)}</h2>
    <div class="sl-note">이 개념을 함께 알아봅시다</div></div>`;
  if(sl.kind==="fig")return `<div class="sl"><figure class="tfig">${sl.svg}${sl.cap?`<figcaption>${esc(sl.cap)}</figcaption>`:""}</figure></div>`;
  if(sl.kind==="list")return `<div class="sl">${sl.title?`<h2 class="sl-h">${sl.title}</h2>`:""}
    <ul class="sl-ul">${sl.items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(sl.kind==="table")return `<div class="sl">${sl.title?`<h2 class="sl-h">${sl.title}</h2>`:""}
    <div class="ttblwrap"><table class="ttbl sl-tbl">
    ${sl.head?`<tr>${sl.head.map(c=>`<th>${c}</th>`).join("")}</tr>`:""}
    ${sl.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
    </table></div></div>`;
  if(sl.kind==="text")return `<div class="sl">${sl.title?`<h2 class="sl-h">${sl.title}</h2>`:""}
    <p class="sl-p">${sl.p}</p></div>`;
  if(sl.kind==="tip")return `<div class="sl sl-tipwrap"><div class="sl-tip"><b>💡 이것만은 꼭!</b><div>${sl.text}</div></div></div>`;
  return "";
}
const MAX_BLANKS=18;
function blankify(html){
  const total=(String(html).match(/<b>[\s\S]*?<\/b>/g)||[]).length;
  const step=total>MAX_BLANKS?Math.ceil(total/MAX_BLANKS):1;   // 너무 많으면 골고루 솎아냄
  let n=-1;
  return String(html).replace(/<b>([\s\S]*?)<\/b>/g,(m,inner)=>{
    n++;
    if(n%step!==0)return `<b>${inner}</b>`;          // 빈칸으로 만들지 않은 것은 그대로 굵게
    const i=BLANKS.push(inner)-1;
    return `<span class="blk" id="blk${i}" onclick="revealBlank(${i})">?</span>`;});
}
function revealBlank(i){const el=$("#blk"+i);if(!el||el.classList.contains("on"))return;

          <span class="num">${NUM[num]}</span><span>${q.choicesImg?"":fmt(c)}</span></div>`;}).join("")}
    </div>
    <div class="expl ${done?"show":""}">${done?`<b class="ansline">✅ 정답 ${NUM[q.answer]}번${q.choicesImg?" (위 그림 참고)":""}</b>`:""}<b>해설</b> · ${fmt(q.explain)}</div>
    <div class="lessonnav">
      <button class="btn ghost" onclick="lessonBackToSlides()">◀ 설명</button>
      ${qz.i<qz.qs.length-1
        ? `<button class="btn primary" onclick="lessonNextQ()">다음 문제 ▶</button>`
        : `<button class="btn primary" onclick="lessonNextCard()">다음 개념 ▶</button>`}
    </div>`;
}
function lessonAnswer(n){LESSON.quiz.picked=n;
  const q=LESSON.quiz.qs[LESSON.quiz.i];
  const st=LS.getStat();st.solved++;if(n===q.answer)st.correct++;LS.setStat(st);
  if(n!==q.answer)LS.addWrong(q._k,q.no);
  SYNC.saveSoon();renderLesson();}
function lessonNextQ(){LESSON.quiz.i++;LESSON.quiz.picked=null;renderLesson();}
function lessonNextCard(){
  const s=THEORY[LESSON.si],c=s.chapters[LESSON.ci];
  if(LESSON.ki<c.cards.length-1){
    LESSON.ki++;LESSON.slide=0;LESSON.blanked=false;LESSON.phase="slide";LESSON.quiz=null;
    LESSON.slides=buildSlides(s,c.cards[LESSON.ki]);renderLesson();
  } else lessonDone();
}
function lessonDone(){
  const s=THEORY[LESSON.si],c=s.chapters[LESSON.ci];
  app.innerHTML=`
  <button class="back" onclick="exitBoard();lessonChapters(${LESSON.si})">← 단원 선택</button>
  <div class="card" style="text-align:center">
    <div style="font-size:52px;margin:10px 0">🎉</div>
    <h3 style="margin:0 0 6px">수업 완료!</h3>
    <p style="color:var(--muted);font-size:14px">${esc(s.subject)} · ${esc(c.title)}<br>개념 <b>${c.cards.length}개</b>를 모두 학습했습니다.</p>
    <div class="navbtns" style="margin-top:18px">
      <button class="btn ghost" onclick="exitBoard();lessonChapters(${LESSON.si})">다른 단원</button>
      <button class="btn primary" onclick="exitBoard();studyPick()">문제 더 풀기</button>
    </div>
  </div>`;
}

/* ---------------- 오답노트 ---------------- */
let NOTE=null;
function wrongNote(){
  const w=LS.getWrong();
  const qs=w.map(x=>{const q=findQ(x.k,x.no);return q?{...q,_k:x.k}:null;}).filter(Boolean);
  if(!qs.length){
    app.innerHTML=`<button class="back" onclick="home()">← 홈</button>
    <div class="card"><span class="pill">오답노트</span>
    <div class="empty">아직 저장된 오답이 없습니다.<br>CBT나 과목별 학습에서 틀린 문제가 자동으로 모입니다. 💪</div></div>`;return;}
  NOTE={qs,i:0,picked:null};renderNote();
}
function renderNote(){
  const q=NOTE.qs[NOTE.i],picked=NOTE.picked,done=picked!=null;
  app.innerHTML=`
  <button class="back" onclick="home()">← 홈</button>
  <div class="card">
    <div class="qhead"><span class="qno">오답 ${NOTE.i+1} / ${NOTE.qs.length}</span><span class="qsubj">${esc(q.subject)} · ${q._k}</span></div>
    <div class="qtext">${fmt(q.q)}</div>
    ${q.img?`<img class="qimg" src="${q.img}">`:""}
    <div class="choices" id="choices"></div>
    <div class="expl ${done?"show":""}">${done?`<b class="ansline">✅ 정답 ${NUM[q.answer]}번${q.choicesImg?" (위 그림 참고)":""}</b>`:""}<b>해설</b> · ${fmt(q.explain)}</div>
    <div class="navbtns">
      <button class="btn ghost" onclick="noteGo(-1)" ${NOTE.i===0?"disabled":""}>◀ 이전</button>
      <button class="btn ghost" onclick="masterNote()">✓ 익힘(삭제)</button>
      <button class="btn primary" onclick="noteGo(1)" ${NOTE.i===NOTE.qs.length-1?"disabled":""}>다음 ▶</button>
    </div>
  </div>`;
  const ch=$("#choices");
  q.choices.forEach((c,k)=>{const n=k+1;const d=document.createElement("div");
    let cls="choice";if(done){cls+=" disabled";if(n===q.answer)cls+=" correct";else if(n===picked)cls+=" wrong";}
    d.className=cls;d.innerHTML=`<span class="num">${NUM[n]}</span><span>${q.choicesImg?"":fmt(c)}</span>`;
    if(!done)d.onclick=()=>{NOTE.picked=n;renderNote();};ch.appendChild(d);});
}
function noteGo(d){const ni=NOTE.i+d;if(ni<0||ni>=NOTE.qs.length)return;NOTE.i=ni;NOTE.picked=null;renderNote();}
function masterNote(){const q=NOTE.qs[NOTE.i];LS.removeWrong(q._k,q.no);SYNC.saveSoon();
  NOTE.qs.splice(NOTE.i,1);if(!NOTE.qs.length){home();return;}
  if(NOTE.i>=NOTE.qs.length)NOTE.i=NOTE.qs.length-1;NOTE.picked=null;renderNote();}

/* boot */
if(!EXAMS.length){app.innerHTML=`<div class="card"><div class="empty">문제 데이터를 불러오지 못했습니다.</div></div>`;}
else if(SYNC.on()&&!SYNC.me()){gate();}
else home();
</script>
